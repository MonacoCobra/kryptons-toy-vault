name: Android TWA APK

on:
  push:
    tags:
      - "android-v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "App version name (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "App version code (integer)"
        required: true
        default: "1"
        type: string
      twa_host:
        description: "TWA host (no scheme), e.g. kryptons-toy-vault.grok.me"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version and host
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
            TAG="android-v${VERSION_NAME}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION_NAME="${TAG#android-v}"
            if [[ "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              VERSION_CODE=$(( ${BASH_REMATCH[1]} * 10000 + ${BASH_REMATCH[2]} * 100 + ${BASH_REMATCH[3]} ))
            else
              VERSION_CODE="${GITHUB_RUN_NUMBER}"
            fi
          fi
          HOST="${{ inputs.twa_host }}"
          if [[ -z "$HOST" ]]; then
            HOST="${{ secrets.TWA_HOST }}"
          fi
          if [[ -z "$HOST" ]]; then
            HOST="kryptons-toy-vault.grok.me"
          fi
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          HOST="${HOST%/}"
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
            echo "host=$HOST"
          } >> "$GITHUB_OUTPUT"
          echo "Building host=$HOST version=$VERSION_NAME code=$VERSION_CODE tag=$TAG"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Prepare TWA (manifest, keystore, assetlinks)
        id: prepare
        env:
          HOST: ${{ steps.meta.outputs.host }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # Tag releases and normal dispatch builds must use the durable keystore.
          REQUIRE_STABLE_KEYSTORE: "1"
        run: bash scripts/android/ci-prepare.sh

      - name: Build signed APK
        env:
          ALIAS: ${{ steps.prepare.outputs.alias }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ steps.prepare.outputs.store_pass }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ steps.prepare.outputs.key_pass }}
        run: bash scripts/android/ci-build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-twa-apk
          path: |
            twa/app-release-signed.apk
            twa/*.aab
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          HOST: ${{ steps.meta.outputs.host }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          FINGERPRINT: ${{ steps.prepare.outputs.fingerprint }}
          EPHEMERAL: ${{ steps.prepare.outputs.ephemeral }}
        run: bash scripts/android/ci-release.sh
